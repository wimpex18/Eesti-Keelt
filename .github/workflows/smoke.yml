# Checks the deployed public app anonymously. Only WORKER_URL is needed.
name: smoke

on:
  workflow_dispatch:
    inputs:
      deep:
        description: >-
          Also send one sentence through grammar and generated audio through speech. Consumes Workers
          AI quota, so it is opt-in rather than run on every deploy.
        type: boolean
        default: false
  workflow_run:
    workflows: [deploy]
    types: [completed]
  # Daily, because Cloud Build redeploys the app on every push to `main` while
  # `deploy` runs only for Worker paths. Not on every push: that fires before Cloud
  # Build finishes and would always report a stale image. Off the hour mark.
  schedule:
    - cron: "43 5 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke helpers
        uses: actions/checkout@v7

      - name: Check the deployment answers, and answers correctly
        env:
          URL: ${{ secrets.WORKER_URL }}
          DEEP: ${{ inputs.deep }}
          # Set only for `workflow_run`: the commit whose deploy fired this run.
          TRIGGER_COMMIT_AT: ${{ github.event.workflow_run.head_commit.timestamp }}
          # On a schedule there is no triggering commit: ask the API for `main`'s head.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::Smoke test not configured. Add WORKER_URL, \
          to run it."
            exit 0
          fi

          auth=()
          fail=0
          sandbox_ready=0
          if source deploy/smoke-sandbox.sh; then
            sandbox_ready=1
          else
            fail=1
          fi

          # Anonymous entry must succeed and must never inherit owner state.
          code="$(curl -s -o /dev/null -w '%{http_code}' "$URL/")"
          if [ "$code" != "200" ]; then
            echo "::error::Public shell returned $code"
            fail=1
          fi
          me="$(curl -sf "$URL/api/auth/me")"
          if [ "$(jq -r '.scope' <<<"$me")" != "guest" ]; then
            echo "::error::Anonymous visitors must be guests"
            fail=1
          fi

          body="$(curl -s "${auth[@]}" "$URL/api/health")"
          echo "$body" | grep -q '"words"' \
            && echo "health .................. OK" \
            || { echo "::error::health did not answer: ${body:0:200}"; fail=1; }

          # The Cloud Run volume may be configured yet still point at a missing
          # or unreadable EKI database. The app reports rows it opened.
          forms="$(jq -r '.recordings.forms // 0' <<<"$body")"
          if [ "$forms" -gt 0 ]; then
            echo "EKI audio mount .......... OK ($forms forms)"
          else
            echo "::error::No EKI recordings are readable on the deployment."
            fail=1
          fi

          # 2b. Which build-time reference imports landed (row counts).
          #
          #     Each import may fail without failing the image build, costing one feature
          #     silently — so the deployment is asked. Warnings, not failures.
          for f in rections eki_levels eki_definitions eki_russian eki_object_verbs eki_terms eki_loanwords eki_explanatory; do
            n="$(jq -r --arg k "$f" '.reference[$k] // 0' <<<"$body")"
            if [ "${n:-0}" -gt 0 ]; then
              printf 'reference %-16s %s rows\n' "$f" "$n"
            else
              # One hint per field. A single shared hint told the EKI rows to
              # "run 'cli rections'", which fills neither of them.
              case "$f" in
                rections) hint="Run 'python -m eesti.cli rections' and rebuild." ;;
                *)        hint="The EKI import failed at image build; check the Cloud \
          Build log and deploy/eki/. See docs/sources.md." ;;
              esac
              echo "::warning::The deployed image has no $f. $hint"
            fi
          done

          # 3. Which build is answering (the image's build stamp). The Worker and the app
          #    deploy by different routes, so a green `deploy` says nothing about the app.
          built="$(jq -r '.built // ""' <<<"$body")"
          if [ -n "$built" ]; then
            echo "image built .............. $built"
          else
            echo "::warning::The deployed image carries no build stamp — it \
          predates one. Rebuild the container to date it."
          fi

          # 3b. Is that image older than the commit this run is about?
          #
          #     A run fired by `deploy` usually sees the previous image, because Cloud Build
          #     is still building. A warning, never a failure. On a schedule, main's head
          #     comes from the GitHub API; a failed lookup falls through to the "could not
          #     compare" warning.
          #
          # Which question this run answers is decided by how long ago `main`'s head was
          # committed: minutes means Cloud Build has not finished; past the build window it
          # means the build failed or never ran.
          if [ -z "$TRIGGER_COMMIT_AT" ] && [ -n "$GH_TOKEN" ]; then
            TRIGGER_COMMIT_AT="$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/main" \
              | jq -r '.commit.committer.date // ""' 2>/dev/null || echo "")"
            [ -n "$TRIGGER_COMMIT_AT" ] \
              && echo "comparing against ........ main @ $TRIGGER_COMMIT_AT" \
              || echo "::warning::Could not read main's head commit, so this \
          run cannot say whether the image it checked is the current one."
          fi

          # Cloud Build takes 10–15 minutes to build and deploy; past this a
          # stale image is a failed build, not a slow one.
          BUILD_WINDOW=$(( 25 * 60 ))
          if [ -n "$built" ] && [ -n "$TRIGGER_COMMIT_AT" ]; then
            built_at="$(date -u -d "$built" +%s 2>/dev/null || echo 0)"
            commit_at="$(date -u -d "$TRIGGER_COMMIT_AT" +%s 2>/dev/null || echo 0)"
            if [ "$built_at" -eq 0 ] || [ "$commit_at" -eq 0 ]; then
              echo "::warning::Could not compare the build stamp ('$built') \
          with the triggering commit ('$TRIGGER_COMMIT_AT'), so this run cannot \
          say whether it is looking at the new image."
            elif [ "$built_at" -lt "$commit_at" ] && \
                 [ $(( $(date -u +%s) - commit_at )) -gt "$BUILD_WINDOW" ]; then
              echo "::warning::STALE IMAGE — built $built, older than main's \
          head ($TRIGGER_COMMIT_AT), which was committed more than \
          $(( BUILD_WINDOW / 60 )) minutes ago. Cloud Build has had time and the \
          image is still behind, so the build FAILED or never ran for that \
          commit. Everything below describes an older deployment. Check the \
          Cloud Build history."
            elif [ "$built_at" -lt "$commit_at" ]; then
              echo "::warning::STALE IMAGE — built $built, before main's head \
          ($TRIGGER_COMMIT_AT), committed $(( ($(date -u +%s) - commit_at) / 60 )) \
          minutes ago. Cloud Build had not \
          finished yet (it takes 10–15 minutes), so everything below describes \
          the PREVIOUS deployment, not the change just merged. Re-run this \
          workflow in a few minutes."
            else
              echo "image is current ........ OK (built $built, after \
          $TRIGGER_COMMIT_AT)"
            fi
          fi

          # 4. The origin guard is on. A deploy that silently dropped the
          #    environment variables would look perfectly healthy above.
          echo "$body" | grep -q '"origin_guarded":true' \
            && echo "origin guarded .......... OK" \
            || { echo "::error::origin_guarded is false — the run.app URL is open."; fail=1; }

          # 5. Endpoints that must not return 500.
          for path in /api/library /api/status /api/curriculum; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$URL$path")"
            [ "$code" = "200" ] \
              && echo "$(printf '%-24s' "$path") OK" \
              || { echo "::error::$path returned $code"; fail=1; }
          done

          # The exam mount is only useful if a task in the published library
          # resolves to its actual file, not merely to extracted text.
          exam_code="$(curl -s -o "$RUNNER_TEMP/exam-a2.json" -w '%{http_code}' \
            "${auth[@]}" "$URL/api/exam/A2")"
          if [ "$exam_code" != 200 ]; then
            echo "::error::A2 exam catalogue returned $exam_code."
            fail=1
          else
            file_id="$(jq -r '[.[] | arrays | .[] | select(.file == true and .format == "pdf") | .id][0] // empty' \
              "$RUNNER_TEMP/exam-a2.json")"
            if [ -n "$file_id" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                "${auth[@]}" "$URL/api/exam/file/$file_id")"
              if [ "$code" = 200 ]; then
                echo "HARNO exam mount ........ OK (downloaded task opens)"
                pages="$(curl -sf "${auth[@]}" "$URL/api/exam/pages/$file_id" \
                  | jq -r '.pages // 0' 2>/dev/null || echo 0)"
                if [ "${pages:-0}" -gt 0 ]; then
                  echo "HARNO PDF pages ........ OK ($pages pages)"
                  if [ "$DEEP" = true ]; then
                    page_code="$(curl -s -o "$RUNNER_TEMP/exam-page.png" -w '%{http_code}' \
                      "${auth[@]}" "$URL/api/exam/page/$file_id/1")"
                    if [ "$page_code" = 200 ] && \
                       [ "$(file -b --mime-type "$RUNNER_TEMP/exam-page.png")" = image/png ]; then
                      echo "HARNO PDF rendering .... OK (page 1 is PNG)"
                    else
                      echo "::error::Downloaded PDF page did not render (HTTP $page_code)."
                      fail=1
                    fi
                  fi
                else
                  echo "::error::Downloaded PDF has no readable pages."
                  fail=1
                fi
              else
                echo "::error::Downloaded exam task returned $code."
                fail=1
              fi
            else
              echo "public exam catalogue ... OK (no shared PDF tasks)"
            fi
          fi

          # 5b. Which *code* is answering: a behaviour only newer code has (`total` on
          #     /api/library), since `revision` is not passed by the trigger. When it stops
          #     discriminating, move the marker to something newer.
          lib="$(curl -s "${auth[@]}" "$URL/api/library?skill=lugemine&limit=1")"
          if [ "$(jq -r 'has("total")' <<<"$lib")" = true ]; then
            echo "image carries /api/library total ($(jq -r '.total' <<<"$lib") texts)"
          else
            echo "::warning::/api/library has no \`total\` — the running image \
          predates that merge, so anything else merged with it is not live either."
          fi

          # 6. Speech configuration only; actual audio requires a separate ASR probe.
          curl -s "${auth[@]}" "$URL/api/asr" | grep -q '"ready":true' \
            && echo "speech .................. configured (audio inference not tested)" \
            || echo "::warning::/api/asr reports not ready."
          home="$(curl -s "${auth[@]}" "$URL/api/asr/home")"
          if ! jq -e '.configured == true' <<<"$home" >/dev/null; then
            echo "::error::Home ASR binding unavailable; deploy the Worker with VPC service access."
            fail=1
          elif jq -e '.online == true' <<<"$home" >/dev/null; then
            echo "home speech ............. online (audio inference not tested)"
          else
            echo "::warning::Home ASR configured but offline; Cloudflare fallback remains available."
          fi

          # VAPID lives on the Worker. A configured cron alone cannot send push.
          push="$(curl -s -w '\n%{http_code}' "${auth[@]}" "$URL/api/push/key")"
          if [ "$(tail -1 <<<"$push")" = 403 ]; then
            echo "reminder keys ........... not inspected (guest sandbox cannot subscribe)"
          elif [ "$(sed '$d' <<<"$push" | jq -r '.configured // false')" = true ]; then
            echo "reminder keys ........... configured (browser opt-in/delivery not tested)"
          else
            echo "::warning::Reminders lack Worker VAPID keys; configure them before browser opt-in."
          fi

          # 7. The grammar checker is configured to explain (`can_explain`, read with jq). A
          #    warning: running without an LLM key is a legitimate choice.
          #
          #    Asked five times, because two revisions can serve during a rollout and
          #    disagreement between instances is itself the finding.
          yes_n=0; no_n=0; gone_n=0
          for _ in 1 2 3 4 5; do
            out="$(curl -s -w '\n%{http_code}' "${auth[@]}" "$URL/api/engines")"
            case "$(tail -1 <<<"$out")" in
              404) gone_n=$((gone_n + 1)) ;;
              200) if [ "$(sed '$d' <<<"$out" | jq -r '.can_explain')" = true ]
                   then yes_n=$((yes_n + 1)); else no_n=$((no_n + 1)); fi ;;
            esac
          done

          # Counted with `if`, not `[ ... ] && x`, which would end the step under -e.
          kinds=0
          if [ "$yes_n"  -gt 0 ]; then kinds=$((kinds + 1)); fi
          if [ "$no_n"   -gt 0 ]; then kinds=$((kinds + 1)); fi
          if [ "$gone_n" -gt 0 ]; then kinds=$((kinds + 1)); fi

          if [ "$gone_n" = 5 ]; then
            # The running image predates this endpoint; say so rather than guess.
            echo "::notice::/api/engines not in the deployed image yet."
          elif [ "$kinds" -gt 1 ]; then
            echo "::error::Instances disagree ($yes_n with an engine, \
          $no_n without, $gone_n on an older image). Traffic is split across \
          revisions, so the app works or does not depending on which one \
          answers. Fix: gcloud run services update-traffic SERVICE \
          --region REGION --to-latest"
            fail=1
          elif [ "$yes_n" = 5 ]; then
            # "configured", not "OK": `/api/engines` reads configuration only and cannot see a
            # provider whose calls fail. The deep check below proves it.
            echo "grammar explains ........ configured (live call unproven \
          — re-run with deep:true to send one sentence through)"
          else
            echo "::warning::No engine can explain a correction — the grammar \
          checker is in offline mode. Run deploy/set-llm-key.sh."
          fi

          # 8. Opt-in: one real sentence through the whole chain.
          #
          #    Proves the key works (a revoked key is still configured). Costs one request of
          #    a free tier, so it is not automatic. The sentence exercises the learner's
          #    documented weakness: "Ma lugesin raamatut läbi" — completed, so genitive
          #    `raamatu`.
          if [ "$DEEP" = "true" ]; then
            if [ "$sandbox_ready" != 1 ]; then
              echo "::error::Deep grammar submission skipped: sandbox isolation unconfirmed."
              exit 1
            fi
            answer="$(curl -s "${auth[@]}" -X POST "$URL/api/check" \
              -H 'Content-Type: application/json' \
              -d '{"text":"Ma lugesin raamatut läbi."}')"
            field() { jq -r --arg k "$1" '.[$k] // ""' <<<"$answer"; }
            engine="$(field engine)"
            case "$engine" in
              llm:*) echo "grammar chain ........... OK (answered by $engine)" ;;
              "")    echo "::error::/api/check did not answer: ${answer:0:200}"
                     fail=1 ;;
              # The diagnostics say why each provider was passed over: "unavailable" means no key
              # on this process (run deploy/set-llm-key.sh); an error name means the call failed
              # (revoked key, rate limit, withdrawn model). Never a response body.
              *)     echo "::warning::Answered by '$engine' — no explanation \
          behind it. Lanes: $(field diagnostics)" ;;
            esac

            # Generated reference audio proves routing/authentication only;
            # it is not learner audio or an ASR quality evaluation.
            if curl -sf "${auth[@]}" -G --data-urlencode 'text=Ma elan Tallinnas.' \
                "$URL/api/speak" -o "$RUNNER_TEMP/speech.wav"; then
              speech_http="$(curl -s --max-time 70 "${auth[@]}" -X POST \
                -H 'Content-Type: audio/wav' --data-binary "@$RUNNER_TEMP/speech.wav" \
                -o "$RUNNER_TEMP/heard.json" -w '%{http_code}' \
                "$URL/api/transcribe")" || speech_http=000
              heard="$(cat "$RUNNER_TEMP/heard.json" 2>/dev/null || echo '{}')"
              speech_engine="$(jq -r '.engine // ""' <<<"$heard")"
              if ! jq -e '.degraded == false and (.text | length > 0)' <<<"$heard" >/dev/null; then
                speech_note="$(jq -r 'if (.note | type) == "string" then .note[0:160] else "" end' <<<"$heard" 2>/dev/null || echo '')"
                echo "::error::Generated speech sample did not transcribe (HTTP $speech_http; engine $speech_engine; $speech_note)."
                fail=1
              elif jq -e '.online == true' <<<"$home" >/dev/null && \
                   [[ "$speech_engine" != *"Mac mini"* ]]; then
                echo "::error::Home ASR reported online but sample used $speech_engine; check HOME_ASR_TOKEN and Mac service logs."
                fail=1
              else
                echo "speech chain ............ OK (answered by $speech_engine; routing only)"
              fi
            else
              echo "::error::Generated reference audio unavailable; speech chain not verified."
              fail=1
            fi
          fi

          # 9. Which live dictionary answers the word card: Ekilex (with `EKILEX_API_KEY`) or
          #    the Sõnaveeb mirror. One word, stored after the first ask. A warning, never a
          #    failure.
          card="$(curl -s "${auth[@]}" "$URL/api/enrich/poiss")"
          # The first field a live dictionary answered (the definition slot may hold PSV's
          # wording).
          live="$(jq -r '[.definition_source, .russian_source, .full_definition_source]
            | map(select(. == "ekilex" or . == "sonapi")) | first // ""' \
            <<<"$card" 2>/dev/null)"
          case "$live" in
            ekilex) echo "live dictionary ......... OK (Ekilex)" ;;
            sonapi) echo "::warning::The word card reads the Sõnaveeb mirror, \
          not Ekilex — EKILEX_API_KEY is not in effect on the serving revision. \
          Run 'bash deploy/check-service.sh' in Cloud Shell." ;;
            *)      echo "::warning::The word card named no live dictionary \
          — Ekilex and the mirror both unanswered, \
          or over today's lookup budget." ;;
          esac

          # 10. The reading library and its topic links. Warnings, not errors: an unharvested
          #     deployment is supported. `topic_items` is filled only by `cli link-topics`, so
          #     a corpus can have texts and no links.
          library="$(curl -s "${auth[@]}" "$URL/api/health")"
          items="$(jq -r '.corpus.items // 0' <<<"$library")"
          links="$(jq -r '.corpus.topic_links // 0' <<<"$library")"
          if [ "${items:-0}" -gt 0 ]; then
            echo "reading library ......... OK ($items texts)"
            [ "${links:-0}" -gt 0 ] \
              && echo "topic links ............. OK ($links)" \
              || echo "::warning::$items texts and no topic links, so no drill \
          offers anything to read. Run 'python -m eesti.cli link-topics' and \
          push again."
          else
            echo "public reading library ... empty (personal imports are excluded)"
          fi

          exit $fail
