# Checks the *deployed* app, not the code.
#
# Why this exists: Cloudflare Access closes the front door and PROXY_TOKEN
# closes the origin, which is exactly right — and it means nobody working on
# this repo can reach the running app to confirm it works. Three production
# bugs in this project were found by asking the live deployment rather than
# reading the code, so losing that ability outright would be a bad trade.
#
# The way back in is an Access **service token**: a credential minted for a
# machine, allowed by its own policy, revocable on its own. It lives in GitHub
# Actions secrets, which is where CI credentials belong — not in a chat, not in
# an environment variable box, and not in anyone's hands.
#
# Setup, once:
#   1. Zero Trust -> Access -> Service Auth -> Service Tokens -> Create.
#   2. Add the pair as repository secrets CF_ACCESS_CLIENT_ID and
#      CF_ACCESS_CLIENT_SECRET, plus WORKER_URL.
#   3. On the Worker's Access application, add a policy:
#      Action "Service Auth", Include -> Service Token -> the one you made.
name: smoke

on:
  workflow_dispatch:
    inputs:
      deep:
        description: >-
          Also send one sentence through the grammar chain. Costs one LLM
          request of a 50/day free tier, so it is opt-in rather than run on
          every deploy.
        type: boolean
        default: false
  workflow_run:
    workflows: [deploy]
    types: [completed]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployment answers, and answers correctly
        env:
          URL: ${{ secrets.WORKER_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEEP: ${{ inputs.deep }}
        run: |
          if [ -z "$URL" ] || [ -z "$CF_ID" ] || [ -z "$CF_SECRET" ]; then
            echo "::warning::Smoke test not configured. Add WORKER_URL, \
          CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET to run it."
            exit 0
          fi

          auth=(-H "CF-Access-Client-Id: $CF_ID"
                -H "CF-Access-Client-Secret: $CF_SECRET")
          fail=0

          # 1. The front door is shut to anyone without the token. This is the
          #    check that matters most: everything else is a feature, this is
          #    the licence obligation.
          code="$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health")"
          if [ "$code" = "302" ] || [ "$code" = "403" ]; then
            echo "closed to anonymous ...... OK ($code)"
          else
            echo "::error::Anonymous request returned $code — the app is OPEN."
            fail=1
          fi

          # 2. It answers a request that carries the service token.
          body="$(curl -s "${auth[@]}" "$URL/api/health")"
          echo "$body" | grep -q '"words"' \
            && echo "health .................. OK" \
            || { echo "::error::health did not answer: ${body:0:200}"; fail=1; }

          # 3. Which build is answering.
          #
          #    A Python change was merged, the Worker redeployed, and the new
          #    endpoint was still missing from production — with no way to tell
          #    whether the container build had not run yet, had failed, or was
          #    never wired up. The Worker and the app deploy by different
          #    routes, so "the deploy went green" says nothing about the app.
          built="$(jq -r '.built // ""' <<<"$body")"
          if [ -n "$built" ]; then
            echo "image built .............. $built"
          else
            echo "::warning::The deployed image carries no build stamp — it \
          predates one. Rebuild the container to date it."
          fi

          # 4. The origin guard is on. A deploy that silently dropped the
          #    environment variables would look perfectly healthy above.
          echo "$body" | grep -q '"origin_guarded":true' \
            && echo "origin guarded .......... OK" \
            || { echo "::error::origin_guarded is false — the run.app URL is open."; fail=1; }

          # 5. The endpoints that returned 500 in production once already.
          for path in /api/library /api/status /api/curriculum; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$URL$path")"
            [ "$code" = "200" ] \
              && echo "$(printf '%-24s' "$path") OK" \
              || { echo "::error::$path returned $code"; fail=1; }
          done

          # 5b. Which *code* is answering, as opposed to when it was built.
          #
          #     A timestamp cannot answer the question anybody actually has,
          #     which is "does the running image contain the change I merged?".
          #     It came up immediately: a merge landed at 16:10 and the stamp
          #     read 16:13, and a failure that the merge was supposed to fix
          #     was still there. Stale image, or fix live and something else
          #     wrong? The stamp cannot say, and `revision` is null because
          #     the Cloud Build trigger passes no BUILD_REV.
          #
          #     So ask for a *behaviour* only the newer code has. `total` was
          #     added to /api/library when the page turned out to be printing
          #     its page size as the library size; an image without it predates
          #     that merge. This is a marker, not a feature test -- when it
          #     stops discriminating, move it to whatever shipped most
          #     recently rather than deleting it.
          lib="$(curl -s "${auth[@]}" "$URL/api/library?skill=lugemine&limit=1")"
          if [ "$(jq -r 'has("total")' <<<"$lib")" = true ]; then
            echo "image carries /api/library total ($(jq -r '.total' <<<"$lib") texts)"
          else
            echo "::warning::/api/library has no \`total\` — the running image \
          predates that merge, so anything else merged with it is not live either."
          fi

          # 6. Speech is reachable. The microphone silently not working is the
          #    kind of thing nobody notices until a speaking exercise.
          curl -s "${auth[@]}" "$URL/api/asr" | grep -q '"ready":true' \
            && echo "speech .................. OK" \
            || echo "::warning::/api/asr reports not ready."

          # 7. The grammar checker can actually explain. This is the check
          #    that would have caught the LLM key being set on the Worker
          #    instead of on Cloud Run: the app stayed healthy, served offline
          #    mode, and because only an explained correction offers a "log
          #    it" button, nothing ever reached the Notion log either. A
          #    warning rather than an error — a deployment with no LLM key is
          #    a legitimate choice; a key that is set and unreachable is not.
          #    Read with jq, not grep. Grepping the body for
          #    `"explains":true` matched a *per-engine* field on a provider
          #    that was not available, so the chain was reported healthy while
          #    it was in offline mode — and the contradiction with the deep
          #    check below sent me looking for a traffic split that did not
          #    exist. The summary field is `can_explain` now, and jq reads
          #    exactly the field asked for.
          #
          #    Asked five times because Cloud Run can serve two revisions at
          #    once during a rollout, and a single request reports whichever
          #    instance it reached — a real split would read as a flake and be
          #    re-run until it passed.
          yes_n=0; no_n=0; gone_n=0
          for _ in 1 2 3 4 5; do
            out="$(curl -s -w '\n%{http_code}' "${auth[@]}" "$URL/api/engines")"
            case "$(tail -1 <<<"$out")" in
              404) gone_n=$((gone_n + 1)) ;;
              200) if [ "$(sed '$d' <<<"$out" | jq -r '.can_explain')" = true ]
                   then yes_n=$((yes_n + 1)); else no_n=$((no_n + 1)); fi ;;
            esac
          done

          # Counted with `if`, not `[ ... ] && x`: the shell runs with -e, and
          # an && list whose test fails returns non-zero, which would end the
          # step.
          kinds=0
          if [ "$yes_n"  -gt 0 ]; then kinds=$((kinds + 1)); fi
          if [ "$no_n"   -gt 0 ]; then kinds=$((kinds + 1)); fi
          if [ "$gone_n" -gt 0 ]; then kinds=$((kinds + 1)); fi

          if [ "$gone_n" = 5 ]; then
            # The running image predates this endpoint. Saying "offline mode"
            # here would be a guess, and a misleading warning is worse than
            # none.
            echo "::notice::/api/engines not in the deployed image yet."
          elif [ "$kinds" -gt 1 ]; then
            echo "::error::Instances disagree ($yes_n with an engine, \
          $no_n without, $gone_n on an older image). Traffic is split across \
          revisions, so the app works or does not depending on which one \
          answers. Fix: gcloud run services update-traffic SERVICE \
          --region REGION --to-latest"
            fail=1
          elif [ "$yes_n" = 5 ]; then
            # "configured", not "OK". `/api/engines` says so itself --
            # "configuration only, nothing here calls a provider" -- so a
            # provider whose free tier is spent still answers `can_explain:
            # true` and still cannot explain anything.
            #
            # This check printed OK in the same run where the deep check below
            # reported `vabamorf-offline` and `llm:openrouter: HTTPError 429`.
            # The two contradicting each other has already cost one debugging
            # round, chasing a Cloud Run traffic split that did not exist; the
            # fix then was to read `can_explain` with jq instead of grepping a
            # per-engine field, which was a real bug and not this one. Naming
            # what was actually verified is what stops it recurring.
            echo "grammar explains ........ configured (live call unproven \
          — re-run with deep:true to send one sentence through)"
          else
            echo "::warning::No engine can explain a correction — the grammar \
          checker is in offline mode. Run deploy/set-llm-key.sh."
          fi

          # 8. Opt-in: one real sentence through the whole chain.
          #
          #    The check above reads configuration; this one proves the key
          #    actually works — a revoked or mistyped key is configured and
          #    useless. It costs a request of a 50/day free tier, which is why
          #    it is not on the automatic path.
          #
          #    The sentence is the learner's documented weakness: "Ma lugesin
          #    raamatut labi" — a completed action, so the object should be
          #    genitive `raamatu`, not partitive `raamatut`.
          if [ "$DEEP" = "true" ]; then
            answer="$(curl -s "${auth[@]}" -X POST "$URL/api/check" \
              -H 'Content-Type: application/json' \
              -d '{"text":"Ma lugesin raamatut läbi."}')"
            field() { jq -r --arg k "$1" '.[$k] // ""' <<<"$answer"; }
            engine="$(field engine)"
            case "$engine" in
              llm:*) echo "grammar chain ........... OK (answered by $engine)" ;;
              "")    echo "::error::/api/check did not answer: ${answer:0:200}"
                     fail=1 ;;
              # The chain records why each provider was passed over, and the
              # distinction decides what to do: "unavailable" means the key is
              # not on this process at all (run deploy/set-llm-key.sh), while
              # an exception name means it is there and the call failed — a
              # revoked key, a rate limit, a model id that no longer exists.
              # The note holds only provider names and exception *types*, never
              # a response body, so it is safe to print.
              *)     echo "::warning::Answered by '$engine' — no explanation \
          behind it. Chain said: $(field note)" ;;
            esac
          fi

          # 9. The reading library. A warning, not an error: an unharvested
          #    deployment is a supported state.
          library="$(curl -s "${auth[@]}" "$URL/api/health")"
          echo "$library" | grep -q '"library":true' \
            && echo "reading library ......... OK" \
            || echo "::warning::No reading library — push a harvest."

          exit $fail
