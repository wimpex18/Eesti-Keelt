name: Estonian model eval

# Answers a question no model card can: does this model actually handle Estonian
# object case? Runs on demand so a key is only ever spent deliberately, and on
# PRs that touch the eval or the providers.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to score
        default: openrouter
        type: choice
        # Hand-maintained, because Actions YAML cannot read `llm.PROVIDERS` --
        # so a test asserts the two agree in both directions. That test exists
        # because this exact shape of list has now drifted twice: `huggingface`
        # was once in `PROVIDERS` and in no chain, and `cli/build.py` offered a
        # `huggingface` that did not exist while omitting `local`.
        #
        # `local` is deliberately absent and is the one documented exclusion: no
        # runner has an Ollama server on `LOCAL_LLM_URL`, and offering a choice
        # that cannot work is the bug this list is guarding against.
        options: [openrouter, groq, workers-ai, huggingface]
      model:
        description: Model to score
        default: "google/gemma-4-31b-it:free"
        type: choice
        options:
          # Every id below the sentinel is OpenRouter's. Picking one of them
          # with a different provider selected sends an id that provider has
          # never heard of -- so the sentinel passes no `--model` at all and
          # lets the provider's own default stand. Without it the expression
          # further down always sent a model, which for any non-OpenRouter lane
          # was the wrong one.
          - (provider default)
          # Only models that accept `response_format`, which is what the client
          # sends — a model that cannot produce JSON fails for the wrong reason.
          # Note that is a *different* capability from `structured_outputs`,
          # which this list used to filter on and which excluded gemma-4-31b.
          #
          # Ordered by active parameters, because that is the axis a
          # low-resource language actually rides on: 30.7B dense, 16B, 12B,
          # 3.8B, 3.6B. The 12B one is the model measured at 0.50/0.50.
          - google/gemma-4-31b-it:free
          - dots-studio/dots-3-note-preview:free
          - nvidia/nemotron-3-super-120b-a12b:free
          - google/gemma-4-26b-a4b-it:free
          - openai/gpt-oss-20b:free
          # huggingface. The Estonian-adapted model this project has wanted from
          # the start, routed to featherless-ai. Select `huggingface` above with
          # this, or with `(provider default)` -- they are the same id, so
          # picking it here changes nothing and is not the fix for a failing
          # run.
          #
          # The `response_format` rule above does NOT hold for this one, and
          # that was the bug: the HF router chooses a provider by what the
          # request asks for, so sending JSON mode to a model whose only
          # provider lacks it leaves no route and answers `400
          # model_not_supported`. The lane sets `json_mode=False` and asks for
          # JSON in the prompt instead.
          - tartuNLP/Llama-3.1-EstLLM-8B-Instruct-1125
      evidence:
        description: >-
          Attach Vabamorf's case analysis (as the real app does). Tests whether
          the model's weakness is judgement or morphology.
        default: false
        type: boolean
  # Weekly, and on demand. NOT on every pull request that touches a provider.
  #
  # It was, and on 2026-08-20 that meant 16 runs in one day -- roughly 288
  # requests against OpenRouter's 50/day free tier. The eval then measured
  # nothing and said so, which is the honest-skip design working, but a gate
  # that cannot run is not a gate. 39 runs on 18 Aug, same story.
  #
  # A model's score changes when the model changes, not when a docstring in
  # `providers/` does. Weekly catches a provider silently swapping a model
  # under a `:free` alias; `workflow_dispatch` covers a deliberate switch.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      PROVIDER: ${{ inputs.provider || 'openrouter' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The EstLLM lane. Without this line the provider could be selected and
      # would report "no key configured" with the secret sitting right there.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Evidence mode is the only thing here that needs Vabamorf; the plain eval
      # path stays stdlib-only so a normal run costs seconds.
      - name: Install morphology (evidence mode only)
        if: inputs.evidence
        run: |
          pip install -r requirements.txt
          python -m eesti.cli fetch-data
          python -m eesti.cli build

      - name: Check the pinned model id still exists
        run: python -m eesti.cli models --provider "$PROVIDER" --limit 10

      # A key is optional, but "no key" must never look like "model passed".
      # The first version of this workflow skipped the scoring step and reported
      # success, which is a green tick standing for no measurement at all.
      - name: Score the model on Estonian
        id: score
        run: |
          # The key for *this* provider, not any key at all. `cli keys | grep ✓`
          # answered "is some lane configured", so selecting `huggingface` with
          # only an OpenRouter key set ran the eval, failed every call, and
          # reported rc=2 -- "rate limit or provider outage", blaming a third
          # party for a missing secret. `available` is the same property the
          # grammar chain uses to decide whether a lane can be called.
          if ! python -c "
          import sys
          from eesti import env
          from eesti.providers.llm import PROVIDERS
          env.load()
          sys.exit(0 if PROVIDERS['$PROVIDER'].available else 1)
          "; then
            echo "SKIPPED=1" >> "$GITHUB_OUTPUT"
            echo "no key configured for $PROVIDER — nothing was measured" > eval.txt
            exit 0
          fi

          # `cmd | tee` reports tee's status, not the command's, so the eval's
          # exit code was being swallowed and an unmeasurable run reported
          # success. pipefail keeps it.
          set -o pipefail
          rc=0
          # `(provider default)` is the sentinel, not an id: passing no
          # --model lets the provider's own default stand.
          MODEL='${{ inputs.model }}'
          [ "$MODEL" = "(provider default)" ] && MODEL=""

          python -m eesti.cli eval --provider "$PROVIDER" \
            ${MODEL:+--model "$MODEL"} \
            ${{ inputs.evidence && '--evidence' || '' }} \
            | tee eval.txt || rc=$?
          echo "RC=$rc" >> "$GITHUB_OUTPUT"

          # 2 = could not measure (rate limit, provider down). That is somebody
          # else's bad minute, so it warns rather than failing the build.
          # 1 = measured, and the model fell below threshold: real information,
          # reported loudly but still not a code defect, so also not a failure.
          # Anything else is an actual crash and should fail.
          if [ "$rc" -gt 2 ]; then exit "$rc"; fi

      - name: Report
        run: |
          {
            echo "## Estonian model eval"
            if [ "${{ steps.score.outputs.SKIPPED }}" = "1" ]; then
              echo
              echo "> **Not run — no API key configured.**"
              echo "> The model-id check passed, but **no model was scored**."
              echo "> Add the key for \`$PROVIDER\` under Settings → Secrets"
              echo "> and variables → Actions, then re-run this workflow."
              echo "> (\`HF_TOKEN\` for huggingface, \`OPENROUTER_API_KEY\` for"
              echo "> openrouter, and so on — \`python -m eesti.cli keys\` lists them.)"
            elif [ "${{ steps.score.outputs.RC }}" = "2" ]; then
              echo
              echo "> **Could not measure.** Every call failed — rate limit or"
              echo "> provider outage. No score is reported, because a run that"
              echo "> never reached the model says nothing about the model."
              echo
              echo '```'
              cat eval.txt
              echo '```'
            else
              echo
              echo '```'
              cat eval.txt
              echo '```'
              echo
              echo "Watch **precision**, not recall: a checker that flags every"
              echo "partitive scores perfect recall and would teach the wrong rule."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Make the absence of a measurement visible in the checks list itself,
      # rather than only in a summary somebody has to open.
      - name: Warn that nothing was measured
        if: steps.score.outputs.SKIPPED == '1' || steps.score.outputs.RC == '2'
        run: |
          echo "::warning title=Eval did not measure::No score was produced \
          (missing key, rate limit, or provider outage). A green check here does \
          NOT mean the model passed."

      - name: Note that the model scored below threshold
        if: steps.score.outputs.RC == '1'
        run: |
          echo "::warning title=Model below threshold::The model was scored and \
          fell under 0.8 recall or precision. See the run summary."
