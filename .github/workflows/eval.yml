name: Estonian model eval

# Answers a question no model card can: does this model actually handle Estonian
# object case? Runs on demand so a key is only ever spent deliberately, and on
# PRs that touch the eval or the providers.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to score
        default: openrouter
        type: choice
        options: [openrouter, groq, workers-ai, anthropic]
      model:
        description: Model to score
        default: "google/gemma-4-26b-a4b-it:free"
        type: choice
        options:
          # Only free models that support structured outputs — the checker needs
          # JSON, and a model that cannot produce it fails for the wrong reason.
          # Gemma first: the OmniGEC work found it gained most on Estonian GEC.
          - google/gemma-4-26b-a4b-it:free
          - dots-studio/dots-3-note-preview:free
          - openai/gpt-oss-20b:free
          - nvidia/nemotron-3-super-120b-a12b:free
          - nvidia/nemotron-nano-9b-v2:free
      evidence:
        description: >-
          Attach Vabamorf's case analysis (as the real app does). Tests whether
          the model's weakness is judgement or morphology.
        default: false
        type: boolean
  pull_request:
    paths:
      - "eesti/evals/**"
      - "eesti/providers/**"
      - ".github/workflows/eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      PROVIDER: ${{ inputs.provider || 'openrouter' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Evidence mode is the only thing here that needs Vabamorf; the plain eval
      # path stays stdlib-only so a normal run costs seconds.
      - name: Install morphology (evidence mode only)
        if: inputs.evidence
        run: |
          pip install -r requirements.txt
          python -m eesti.cli fetch-data
          python -m eesti.cli build

      - name: Check the pinned model id still exists
        run: python -m eesti.cli models --provider "$PROVIDER" --limit 10

      # A key is optional, but "no key" must never look like "model passed".
      # The first version of this workflow skipped the scoring step and reported
      # success, which is a green tick standing for no measurement at all.
      - name: Score the model on Estonian
        id: score
        run: |
          if python -m eesti.cli keys | grep -q '✓'; then
            python -m eesti.cli eval --provider "$PROVIDER" \
              ${{ inputs.model && format('--model {0}', inputs.model) || '' }} \
              ${{ inputs.evidence && '--evidence' || '' }} \
              | tee eval.txt
          else
            echo "SKIPPED=1" >> "$GITHUB_OUTPUT"
            echo "no provider key configured — nothing was measured" > eval.txt
          fi

      - name: Report
        run: |
          {
            echo "## Estonian model eval"
            if [ "${{ steps.score.outputs.SKIPPED }}" = "1" ]; then
              echo
              echo "> **Not run — no API key configured.**"
              echo "> The model-id check passed, but **no model was scored**."
              echo "> Add \`OPENROUTER_API_KEY\` under Settings → Secrets and"
              echo "> variables → Actions, then re-run this workflow."
            else
              echo
              echo '```'
              cat eval.txt
              echo '```'
              echo
              echo "Watch **precision**, not recall: a checker that flags every"
              echo "partitive scores perfect recall and would teach the wrong rule."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Make the absence of a measurement visible in the checks list itself,
      # rather than only in a summary somebody has to open.
      - name: Warn that nothing was measured
        if: steps.score.outputs.SKIPPED == '1'
        run: |
          echo "::warning title=Eval skipped::No API key configured, so no model was scored."
