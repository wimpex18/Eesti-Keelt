name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One Python minor: the one the Dockerfile ships. `test_docs_match_code.py`
      # holds this matrix and `eval.yml` to the Dockerfile's FROM line.
      matrix:
        python-version: ["3.14"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest pytest-xdist

      # Third-party data from HuggingFace. A failure here must not fail the build:
      # the fetcher retries 5xx with backoff, and if it still cannot get the data the
      # validation step below is skipped loudly rather than silently.
      # `--required-only`: the morphology gate needs only `inflection_et`; the drill
      # tests run on fixtures, and fetching the word-order pools too would spend
      # requests (and risk a 429) on data this job never opens.
      - name: Fetch benchmark data
        id: bench
        continue-on-error: true
        run: python -m eesti.cli fetch-bench --required-only

      # Checks Vabamorf against TalTech's native-curated gold forms. Everything
      # the app generates inherits that correctness, so it gates the build —
      # but only when the data is actually available to gate against.
      - name: Validate morphology against native gold data
        if: steps.bench.outcome == 'success'
        run: python -m eesti.cli validate

      - name: Warn that the morphology gate did not run
        if: steps.bench.outcome != 'success'
        run: |
          echo "::warning title=Validation skipped::Benchmark data unavailable \
          (HuggingFace fetch failed after retries), so Vabamorf was NOT checked \
          against gold forms in this run."

      # Runs either way: the validation tests skip themselves when the dataset
      # is absent, and everything else is self-contained.
      - name: Tests
        run: python -m pytest tests/ -q -n auto

  # The learner's journeys in a real browser (tests/test_e2e_journeys.py), at
  # desktop and phone sizes. They need the built word list; if the download
  # fails, the journeys skip themselves loudly instead of failing the build.
  journeys:
    runs-on: ubuntu-latest
    name: browser journeys
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt pytest pytest-xdist playwright==1.63.0
          python -m playwright install --with-deps chromium webkit

      - name: Build the word list
        id: data
        continue-on-error: true
        run: |
          python -m eesti.cli fetch-data
          python -m eesti.cli build

      - name: Warn that the journeys have no data
        if: steps.data.outcome != 'success'
        run: echo "::warning title=Journeys skipped::The word list did not build, so the browser journeys skip."

      - name: Journeys
        run: python -m pytest tests/test_e2e_journeys.py --browser -q -n auto
