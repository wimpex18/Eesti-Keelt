name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # The Python upgrade workflow dispatches this on its branch: a pull request
  # opened with the workflow token starts no pull_request run of its own.
  workflow_dispatch:

# A newer push to the same pull request or branch supersedes a running check.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether anything but Markdown under qa/, docs/ or .claude/ changed. The unit
  # job always runs (it checks the docs); the browser journeys need code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" \
               | grep -qvE '^(qa|docs|\.claude)/.*\.md$|^[^/]+\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  worker:
    runs-on: ubuntu-latest
    name: Worker durability
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:worker

  test:
    runs-on: ubuntu-latest
    strategy:
      # One Python minor: the one the Dockerfile ships. `test_docs_match_code.py`
      # holds this matrix and `eval.yml` to the Dockerfile's FROM line.
      matrix:
        python-version: ["3.14"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install
        run: |
          uv pip install --system --require-hashes -r requirements.lock
          uv pip install --system pytest pytest-xdist

      # Third-party data from HuggingFace. A failure here must not fail the build:
      # the fetcher retries 5xx with backoff, and if it still cannot get the data the
      # validation step below is skipped loudly rather than silently.
      # `--required-only`: the morphology gate needs only `inflection_et`; the drill
      # tests run on fixtures, and fetching the word-order pools too would spend
      # requests (and risk a 429) on data this job never opens.
      - name: Fetch benchmark data
        id: bench
        # Fatal where the gate is the point: manual runs and lock-upgrade PRs.
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.head_ref, 'deps/') }}
        run: python -m eesti.cli fetch-bench --required-only

      # Checks Vabamorf against TalTech's native-curated gold forms. Everything
      # the app generates inherits that correctness, so it gates the build —
      # but only when the data is actually available to gate against.
      - name: Validate morphology against native gold data
        if: steps.bench.outcome == 'success'
        run: python -m eesti.cli validate

      - name: Warn that the morphology gate did not run
        if: steps.bench.outcome != 'success'
        run: |
          echo "::warning title=Validation skipped::Benchmark data unavailable \
          (HuggingFace fetch failed after retries), so Vabamorf was NOT checked \
          against gold forms in this run."

      # Runs either way: the validation tests skip themselves when the dataset
      # is absent, and everything else is self-contained.
      - name: Tests
        run: python -m pytest tests/ -q -n auto

  # The learner's journeys in a real browser (tests/test_e2e_journeys.py): one job
  # per engine, in parallel — Chromium at desktop size, WebKit at phone size. They
  # need the built word list; if the download fails, they skip themselves loudly.
  journeys:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    name: browser journeys (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Build production web assets
        run: npm ci && npm run build:web
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install
        run: |
          uv pip install --system --require-hashes -r requirements.lock
          uv pip install --system pytest pytest-xdist playwright==1.63.0

      - name: Cache the browser
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ matrix.engine }}-${{ runner.os }}
      - name: Install the browser
        run: |
          if [ "${{ steps.browser.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps ${{ matrix.engine }}
          else
            python -m playwright install --with-deps ${{ matrix.engine }}
          fi

      # The word list depends only on the pinned upstream file and these modules.
      - name: Cache the word list
        id: words
        uses: actions/cache@v6
        with:
          path: |
            data/eesti.db
            data/edge.db
          key: wordlist-${{ hashFiles('requirements.lock', 'eesti/reference.py', 'eesti/cli/build.py', 'eesti/wordlist.py', 'eesti/export.py', 'eesti/lookup.py', 'eesti/morph.py') }}

      - name: Build the word list
        id: data
        if: steps.words.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          python -m eesti.cli fetch-data
          python -m eesti.cli build
          python -m eesti.cli export

      - name: Warn that the journeys have no data
        if: steps.words.outputs.cache-hit != 'true' && steps.data.outcome != 'success'
        run: echo "::warning title=Journeys skipped::The word list did not build, so the browser journeys skip."

      # No reading corpus here (its sources are owner-only), so the journeys
      # that read a text skip and the rest run.
      - name: Journeys
        env:
          EESTI_WEB_BUILD: "1"
          EESTI_E2E_NO_CORPUS: "1"
        run: python -m pytest tests/test_e2e_journeys.py --browser --engine ${{ matrix.engine }} -q -n auto -rs
