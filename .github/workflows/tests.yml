name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Two Pythons, and the pair is the point. 3.13 is what the Dockerfile
      # ships and therefore what the learner actually runs. 3.11 is the floor:
      # the oldest version estnltk publishes wheels for, and the one `eval.yml`
      # still runs on, so a change that only works on 3.13 fails here rather
      # than in the eval. `fail-fast: false` so a break on one does not hide
      # the other. `test_deploy_claims.py` holds the first sentence to the
      # Dockerfile's FROM line.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      # Third-party data from HuggingFace. It has returned 502 mid-run, and this
      # project's whole point is not to let someone else's bad minute break the
      # parts we own — so a failure here must not fail the build. The fetcher
      # retries 5xx with backoff; if it still cannot get the data, the validation
      # step below is skipped loudly rather than silently.
      # `--required-only`: the morphology gate needs `inflection_et` and
      # nothing here reads the two extra word-order pools — the drill tests run
      # on fixtures. Fetching them anyway cost 160 requests per push across the
      # two legs and earned a 429 from the datasets server, which skipped the
      # gate. Asking someone else's server for 7 937 rows that this job will
      # not open is the shape this project has a rule about.
      - name: Fetch benchmark data
        id: bench
        continue-on-error: true
        run: python -m eesti.cli fetch-bench --required-only

      # Checks Vabamorf against TalTech's native-curated gold forms. Everything
      # the app generates inherits that correctness, so it gates the build —
      # but only when the data is actually available to gate against.
      - name: Validate morphology against native gold data
        if: steps.bench.outcome == 'success'
        run: python -m eesti.cli validate

      - name: Warn that the morphology gate did not run
        if: steps.bench.outcome != 'success'
        run: |
          echo "::warning title=Validation skipped::Benchmark data unavailable \
          (HuggingFace fetch failed after retries), so Vabamorf was NOT checked \
          against gold forms in this run."

      # Runs either way: the validation tests skip themselves when the dataset
      # is absent, and everything else is self-contained.
      - name: Tests
        run: python -m pytest tests/ -q
