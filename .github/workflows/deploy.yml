# Deploys the Worker that fronts the app.
#
# The app itself is not deployed here: it is a container image built by Cloud
# Build from this repo's Dockerfile and run on Cloud Run. This workflow deploys
# only the doorman in front of it, and hands it the secrets it needs.
#
# Nothing in this file contains a credential. Every value comes from repository
# secrets, which is the one place they belong for CI.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Catch a broken Worker before it is the thing standing between the
      # learner and the app, not after.
      - run: npx tsc --noEmit

      # Fail with a sentence rather than a stack trace. A missing secret here is
      # the most likely reason this workflow ever goes red, and the fix is a
      # settings page, not a code change.
      - name: Check required secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      PROXY_TOKEN STATE_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "See docs/deploy.md for what each one is."
            exit 1
          fi
          # CLOUD_RUN_URL is deliberately NOT required, and that is a safety
          # feature rather than a loose end. Cloudflare Access can only be
          # switched on for a Worker that already exists, so the first deploy
          # would otherwise open the URL for however long it takes to click the
          # toggle. Deploy without it and the Worker answers 503 to everyone;
          # add it after Access is on and re-run. See docs/deploy.md.
          if [ -z "$CLOUD_RUN_URL" ]; then
            echo "::warning title=Worker deployed closed::CLOUD_RUN_URL is not \
          set, so the Worker will answer 503 to every request. Enable \
          Cloudflare Access, then add the secret and re-run this workflow."
          fi

      # Secrets are pushed before the deploy so a first-ever deploy comes up
      # configured rather than answering 503 until someone remembers.
      - name: Push Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          put() {
            # Via stdin: a secret on a command line is a secret in the process
            # table and in any shell trace.
            printf '%s' "$2" | npx wrangler secret put "$1"
          }
          if [ -n "$CLOUD_RUN_URL" ]; then
            put CLOUD_RUN_URL "$CLOUD_RUN_URL"
          fi
          put PROXY_TOKEN "$PROXY_TOKEN"
          put STATE_TOKEN "$STATE_TOKEN"
          # OPENROUTER_API_KEY is deliberately NOT pushed here. It is read by
          # eesti/providers/llm.py, which runs on Cloud Run -- the Worker never
          # looks at it. Storing it here left the grammar checker permanently
          # in offline mode while a secret sat where nothing could use it,
          # which is all of the risk and none of the benefit.
          # It belongs on the Cloud Run service: deploy/set-llm-key.sh.

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
