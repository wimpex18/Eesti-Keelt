# Deploys the Worker that fronts the app.
#
# The app itself is not deployed here: it is a container image built by Cloud
# Build from this repo's Dockerfile and run on Cloud Run. This workflow deploys
# only the doorman in front of it, and hands it the secrets it needs.
#
# Nothing in this file contains a credential. Every value comes from repository
# secrets, which is the one place they belong for CI.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Catch a broken Worker before it is the thing standing between the
      # learner and the app, not after.
      - run: npx tsc --noEmit

      # Fail with a sentence rather than a stack trace. A missing secret here is
      # the most likely reason this workflow ever goes red, and the fix is a
      # settings page, not a code change.
      - name: Check required secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      CLOUD_RUN_URL WORKER_URL PROXY_TOKEN STATE_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "See docs/deploy.md for what each one is."
            exit 1
          fi
          if [ -z "$SESSION_SECRET" ]; then
            echo "::warning title=Account sign-up unavailable::SESSION_SECRET is not set. Anonymous practice stays available; account sign-up and sign-in will return 503. Add the repository secret under Settings -> Secrets and variables -> Actions."
          fi

      - name: Check VPC service access before changing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy/check-vpc-access.sh

      # Secrets are pushed before the deploy so a first-ever deploy comes up
      # configured rather than answering 503 until someone remembers.
      - name: Push Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          put() {
            # Via stdin: a secret on a command line is a secret in the process
            # table and in any shell trace.
            printf '%s' "$2" | npx wrangler secret put "$1"
          }
          if [ -n "$CLOUD_RUN_URL" ]; then
            put CLOUD_RUN_URL "$CLOUD_RUN_URL"
          fi
          put PROXY_TOKEN "$PROXY_TOKEN"
          put STATE_TOKEN "$STATE_TOKEN"
          if [ -n "$SESSION_SECRET" ]; then
            put SESSION_SECRET "$SESSION_SECRET"
          else
            echo "::warning::SESSION_SECRET is not set; account sign-up and sign-in remain unavailable."
          fi
          # Reminders are signed and sent by the Worker (`sendPush`), so the
          # VAPID pair belongs here. Optional: without it the app says
          # reminders are not configured instead of asking for permission it
          # cannot use.
          if [ -n "$VAPID_PUBLIC_KEY" ] && [ -n "$VAPID_PRIVATE_KEY" ]; then
            put VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
            put VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
            put VAPID_SUBJECT "${VAPID_SUBJECT:-mailto:none@example.org}"
          fi
          # OPENROUTER_API_KEY and the other LLM keys are deliberately NOT pushed here:
          # they are read by eesti/providers/llm.py on Cloud Run, and the Worker never
          # looks at them. They belong on the Cloud Run service: deploy/set-llm-key.sh.

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Open and verify public access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: python3 deploy/open-public-access.py
