<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{
  /* Lifted unchanged from eesti/web/app.css - the app's own palette. */
  --paper:#faf9f6; --card:#ffffff; --ink:#1b1b19; --muted:#6b6b66;
  --line:#e3e3de; --accent:#1c6b52; --accent-soft:#e6f2ec; --accent-deep:#12503c;
  --warn:#9a5b00; --warn-soft:#fdf3e3; --bad:#a32c2c; --good:#1c6b52;
  --gloss:#4c6382;
  /* Added by the redesign: one secondary ink and two quieter surfaces, so
     hierarchy stops resting on the single --muted grey. */
  --ink-2:#4a4a45; --line-soft:#efeee9; --tint:#f4f3ee;
  --r-card:20px; --r-ctl:12px; --r-sm:9px;
  --sh:0 1px 2px rgba(16,18,20,.04), 0 10px 28px -18px rgba(16,18,20,.22);
  --f-ui:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
}
/* Dark: the token values are app.css's own dark block, unchanged. Only the
   two tokens this redesign added (--ink-2, --tint) and --line-soft are new. */
.dark{--paper:#16171a; --card:#1e2024; --ink:#e9e9e6; --muted:#9a9a94;
  --line:#2e3138; --accent:#5fbf9b; --accent-soft:#1b302a; --accent-deep:#3f8f72;
  --warn:#e0a758; --warn-soft:#2e2618; --bad:#e88b8b; --good:#5fbf9b;
  --gloss:#9db8d8; --ink-2:#c2c2bb; --line-soft:#26282e; --tint:#242730;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6)}
.dark .btn-pri{color:#0f1512}
.dark .side-badge, .dark .badge{color:#0f1512}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-ui);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-deep)}
svg{display:block;width:18px;height:18px;flex:none}
.ru{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
i.ru{display:inline;font-style:normal;font-size:11.5px;margin-left:6px}
.num{font-variant-numeric:tabular-nums}

/* ── Desktop shell ───────────────────────────────────────────────── */
.dsk{width:1440px;display:grid;grid-template-columns:248px minmax(0,1fr) 300px;
  background:var(--paper);font-family:var(--f-ui);
  /* The row is content-sized by default, so the sidebar and rail stopped
     short of the frame's bottom edge and their borders ended mid-air. */
  grid-template-rows:1fr;
  /* Re-resolve the ink HERE. Elements that set no colour of their own inherit
     body's COMPUTED colour, which was resolved against the light tokens before
     .dark redefined them one level down -- so without this every heading and
     number renders dark-on-dark in the dark theme. */
  color:var(--ink)}
.side{border-right:1px solid var(--line);background:var(--card);
  padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand-t{font-size:15.5px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.brand-s{font-size:11px;color:var(--muted);line-height:1.3;margin-top:1px}
.side-group{display:flex;flex-direction:column;gap:2px}
.side-h{display:flex;flex-direction:column;padding:0 10px;margin-bottom:8px}
.side-h b{font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.side-h span{font-size:10.5px;color:var(--muted);opacity:.85;margin-top:2px}
.side-i{display:flex;align-items:center;gap:11px;height:42px;padding:0 10px;
  border-radius:11px;font-size:14px;font-weight:500;color:var(--ink-2)}
.side-i svg{width:18px;height:18px;flex:none;opacity:.7}
.side-i.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.side-i.on svg{opacity:1}
.side-badge{margin-left:auto;min-width:22px;height:20px;padding:0 6px;
  border-radius:999px;background:var(--accent);color:#fff;font-size:11px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:8px;
  padding:14px 6px 0;border-top:1px solid var(--line-soft)}
.side-foot .who{font-size:12px;color:var(--muted);line-height:1.3}

/* ── The middle width (720-1079) ──────────────────────────────────
   Not a wide phone and not a narrow desktop: the sidebar keeps its
   destinations but drops to icons, and the context rail folds under the
   content instead of taking a third column it cannot afford. */
.side.mini{width:76px;padding:20px 10px 16px;align-items:center;gap:14px}
.side.mini .brand{padding:0}
.side.mini .brand-t, .side.mini .brand-s,
.side.mini .side-i > span:not(.side-badge),
.side.mini .side-h b, .side.mini .side-h span, .side.mini .who{display:none}
.side.mini .side-group{width:100%;align-items:center}
.side.mini .side-h{height:1px;margin:6px 0 8px;padding:0;width:36px;
  background:var(--line-soft)}
.side.mini .side-i{position:relative;width:52px;height:48px;padding:0;
  justify-content:center}
.side.mini .side-i svg{width:20px;height:20px}
.side.mini .side-badge{position:absolute;top:1px;right:1px;min-width:17px;
  height:17px;padding:0 4px;font-size:9.5px;
  /* A ring in the rail's own colour: the count sits ON the icon here, and
     without it the glyph reads through the badge. */
  box-shadow:0 0 0 2px var(--card)}
.side.mini .side-foot{border-top:0;padding-top:0}
.main{padding:26px 32px 40px;min-width:0}
.rail{padding:26px 24px 40px;border-left:1px solid var(--line);
  display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.top h1{font-size:24px;font-weight:650;letter-spacing:-.022em;line-height:1.2}
.top .sub{margin-top:5px;font-size:13px;color:var(--muted);max-width:62ch;line-height:1.5}
.top-actions{margin-left:auto;display:flex;gap:8px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);display:grid;place-items:center;flex:none}
.iconbtn svg{width:17px;height:17px}

/* ── Surfaces ────────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:22px 24px;box-shadow:var(--sh)}
.card + .card{margin-top:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-h h2{font-size:16px;font-weight:650;letter-spacing:-.01em}
.card-h .right{margin-left:auto;font-size:12.5px;color:var(--muted);flex:none}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.note{font-size:13px;line-height:1.65;color:var(--ink-2);max-width:64ch}
.note b{color:var(--ink);font-weight:650}
.sep{height:1px;background:var(--line-soft);margin:18px 0}

/* ── Controls ────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:14.5px;
  font-weight:600;white-space:nowrap;flex:none;line-height:1.15;text-align:center}
.btn svg{width:17px;height:17px;flex:none}
.btn .ru{color:var(--muted);font-weight:500}
.btn-pri{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 2px 0 var(--accent-deep)}
.btn-pri .ru{color:rgba(255,255,255,.78)}
.btn-sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn-quiet{background:var(--tint);border-color:transparent;color:var(--ink-2)}
.btn-wide{width:100%}
.btn.two{flex-direction:column;gap:1px;height:52px;padding:0 20px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field .lab{font-size:12px;font-weight:650;color:var(--muted);
  display:flex;gap:6px;align-items:baseline}
.field .lab i{font-style:normal;font-weight:500;opacity:.85}
.sel,.inp{height:44px;border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--paper);padding:0 13px;font-size:15px;color:var(--ink);
  display:flex;align-items:center;gap:10px;min-width:0}
.sel span,.inp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel svg{width:15px;height:15px;color:var(--muted);flex:none;margin-left:auto}
.inp.ph{color:var(--muted)}
.ta{border:1px solid var(--line);border-radius:14px;background:var(--paper);
  padding:14px 16px;font-size:15.5px;line-height:1.65;color:var(--muted)}
.ta.filled{color:var(--ink);font-family:var(--f-read)}
.filters{display:grid;gap:12px;align-items:end}

.seg{display:inline-flex;background:var(--tint);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:4px;flex:none}
.seg span{height:34px;display:inline-flex;align-items:center;padding:0 16px;
  border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg span.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;
  border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.lvl{display:inline-flex;align-items:center;height:20px;padding:0 7px;
  border-radius:6px;border:1px solid var(--line);background:var(--paper);
  font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted);flex:none}
.lvl.up{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* ── Data ────────────────────────────────────────────────────────── */
.meter{height:8px;border-radius:999px;background:var(--tint);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.meter.warn i{background:var(--warn)}
.ring{width:72px;height:72px;border-radius:50%;flex:none;display:grid;
  place-items:center;position:relative;
  background:conic-gradient(var(--accent) var(--pct),var(--line) 0)}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.ring b{position:relative;z-index:1;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tiles{display:grid;gap:12px}
.tile{border:1px solid var(--line);border-radius:16px;background:var(--card);
  padding:14px 16px}
.tile .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-read);font-size:30px;font-weight:600;line-height:1.05;
  margin-top:8px;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.tile .n{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px}
.bars i{flex:1;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:3px}
.bars i.off{background:var(--line)}
.axis{display:flex;justify-content:space-between;margin-top:7px;
  font-size:10.5px;color:var(--muted)}

.rcard{border:1px solid var(--line);border-radius:16px;background:var(--card);
  padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.rcard h3{font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)}
.rbig{font-family:var(--f-read);font-size:25px;font-weight:600;line-height:1.05;
  letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.rrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;
  align-items:baseline;color:var(--ink-2)}
.rrow b{font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ── Study components ────────────────────────────────────────────── */
.drill{border:1px solid var(--line);border-radius:16px;background:var(--paper);
  padding:18px 20px}
.task{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}
.task .w{font-weight:700;font-size:14px}
.task .form{color:var(--accent);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em}
.task .gl{color:var(--gloss);font-size:13px}
.prompt{font-family:var(--f-read);font-size:19px;line-height:1.65;margin:13px 0}
.blank{color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.prompt.big{font-size:22px}
.corr{border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:14px 16px;background:var(--paper)}
.corr.objcase{border-left-color:var(--warn)}
.fix{font-family:var(--f-read);font-size:16px;margin:9px 0 7px}
.fix del{color:var(--bad);text-decoration:line-through}
.fix ins{color:var(--good);text-decoration:none;font-weight:600}
.why{font-size:13px;line-height:1.6;color:var(--ink-2)}
.why b{color:var(--ink);font-weight:650}
.gl-line{font-size:13px;color:var(--gloss);margin-top:6px}
.gl-line b{color:var(--ink);font-weight:650}

.item{display:flex;gap:12px;align-items:center;padding:13px 15px;
  border:1px solid var(--line);border-radius:14px;background:var(--card)}
.item + .item{margin-top:8px}
.item.ext{border-style:dashed}
.item .t{font-size:14px;font-weight:600;line-height:1.35}
.item .m{font-size:12px;color:var(--muted);margin-top:3px}
.item .r{margin-left:auto;flex:none;display:flex;align-items:center;gap:10px}
.list{display:flex;flex-direction:column}

.topic{display:flex;gap:11px;align-items:center;padding:8px 10px;border-radius:10px;
  font-size:14px}
.topic .st{display:inline-flex;align-items:center;gap:6px;min-width:104px;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);flex:none}
.topic .st svg{width:14px;height:14px;flex:none}
.topic.done .st{color:var(--good)} .topic.now{background:var(--accent-soft)}
.topic.now .st{color:var(--accent)} .topic.ref .st{color:var(--gloss)}
.topic.lock{opacity:.5}
.topic .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic .r{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}

.prose{font-family:var(--f-read);font-size:17px;line-height:1.8}
.prose u{text-decoration:none;border-bottom:1px dotted #b9b9b1}
.prose mark{background:var(--warn-soft);border-radius:3px;padding:0 2px;color:inherit}
.wgrid{display:grid;gap:10px}
.word{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;padding:11px 13px;
  border:1px solid var(--line);border-radius:13px;background:var(--card);min-height:52px}
.word .w{font-weight:650;font-size:15px}
.word .g{font-size:12.5px;color:var(--gloss);width:100%;line-height:1.35}
.word.settled{opacity:.6}
.part{display:flex;gap:12px;align-items:flex-start;padding:14px 0}
.part + .part{border-top:1px solid var(--line-soft)}
.part .mk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.part .mk svg{width:15px;height:15px}
.mk.yes{background:var(--accent-soft);color:var(--good)}
.mk.no{background:var(--warn-soft);color:var(--warn)}
.mk.unk{background:var(--tint);color:var(--muted)}
.part .nm{font-size:14.5px;font-weight:650}
.part .ev{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.part .nx{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.45}
.part .r{margin-left:auto;flex:none;text-align:right}
.banner{border:1px solid var(--line);background:var(--warn-soft);border-color:#eddcbb;
  color:var(--warn);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.6;
  display:flex;gap:11px;align-items:flex-start}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px}
.banner b{font-weight:700}
.flash{text-align:center;padding:26px 20px}
.flash .w{font-family:var(--f-read);font-size:44px;font-weight:600;
  letter-spacing:-.02em;line-height:1.15}
.flash .m{font-size:19px;font-weight:600;color:var(--gloss);margin-top:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.grade{height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:13.5px;font-weight:650}
.grade span{font-size:10.5px;font-weight:500;color:var(--muted)}
.grade.g1{border-color:#e6c9c9;color:var(--bad)}
.grade.g4{border-color:#c6ddd2;color:var(--accent)}

/* ── Mobile shell ────────────────────────────────────────────────── */
.phone{width:390px;height:844px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;background:var(--paper);font-family:var(--f-ui);
  color:var(--ink)}
.m-top{height:60px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:var(--card);border-bottom:1px solid var(--line-soft)}
.m-top h1{font-size:18px;font-weight:650;letter-spacing:-.022em;line-height:1.15}
.m-top .ru{font-size:11px;margin-top:2px}
.m-top .r{margin-left:auto;display:flex;gap:8px;flex:none}
.m-top .iconbtn{width:36px;height:36px}
.m-chips{height:52px;flex:none;display:flex;align-items:center;gap:8px;
  padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);
  overflow:hidden;
  /* The row scrolls sideways; the fade says so, instead of a chip that looks
     accidentally cut off at the edge. */
  -webkit-mask-image:linear-gradient(to right,#000 84%,transparent);
  mask-image:linear-gradient(to right,#000 84%,transparent)}
.m-chips > *{flex:none}
.m-body{flex:1;min-height:0;padding:16px;display:flex;flex-direction:column;
  gap:14px;overflow:hidden}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px 17px}
.m-tab{height:84px;flex:none;display:flex;gap:4px;padding:8px 10px 22px;
  border-top:1px solid var(--line);background:var(--card)}
.m-tab a{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;border-radius:14px;font-size:11.5px;
  font-weight:600;color:var(--muted);min-height:54px}
.m-tab a.on{color:var(--accent);background:var(--accent-soft)}
.m-tab svg{width:22px;height:22px}
.m-sheet{position:absolute;left:0;right:0;bottom:84px;background:var(--card);
  border-top:1px solid var(--accent);border-radius:20px 20px 0 0;padding:16px 17px 18px;
  box-shadow:0 -8px 30px -14px rgba(16,18,20,.3)}
.m-fade{position:absolute;left:0;right:0;bottom:84px;height:34px;
  background:linear-gradient(to top,var(--paper),rgba(250,249,246,0));pointer-events:none}
</style>
